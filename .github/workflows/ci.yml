name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test Pharmacy.sln

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Component tests (headless Chrome)
        run: npm run test:ci
      - run: npx ng build

  docker:
    # Builds both images and runs the whole stack (SQL Server + API + nginx) to check it starts and serves data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write a throwaway .env
        run: |
          cp .env.example .env
          sed -i "s|^SA_PASSWORD=.*|SA_PASSWORD=Ci-Sql-$(openssl rand -hex 6)A1!|" .env
          sed -i "s|^JWT_KEY=.*|JWT_KEY=$(openssl rand -hex 32)|" .env
          sed -i "s|^ADMIN_PASSWORD=.*|ADMIN_PASSWORD=Ci-Admin-$(openssl rand -hex 6)A1!|" .env
      - name: Build and start
        run: docker compose up -d --build
      - name: Wait for the API through nginx
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/api/health; then echo; exit 0; fi
            sleep 5
          done
          docker compose logs api
          exit 1
      - name: Log in and read the demo catalogue
        run: |
          set -a; . ./.env; set +a
          TOKEN=$(curl -fs -H 'Content-Type: application/json' \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}" \
            http://localhost:8080/api/auth/login | jq -r .token)
          COUNT=$(curl -fs -H "Authorization: Bearer $TOKEN" http://localhost:8080/api/medicines | jq length)
          echo "Medicines: $COUNT"
          test "$COUNT" -gt 10
          curl -fs http://localhost:8080/ | grep -q '<app-root>'
      - name: Logs on failure
        if: failure()
        run: docker compose logs

  deploy:
    # Publishes main to the free Azure App Service demo once every check above has passed.
    # The API serves the Angular build from wwwroot, so one app hosts both.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, frontend, docker]
    runs-on: ubuntu-latest
    environment:
      name: azure-demo
      url: https://amaran-pharmacy.azurewebsites.net
    concurrency: azure-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Publish API
        run: dotnet publish backend/Pharmacy.Api/Pharmacy.Api.csproj -c Release -o publish
      - name: Build web app into wwwroot
        working-directory: frontend
        run: |
          npm ci
          npx ng build --configuration production
          mkdir -p ../publish/wwwroot
          cp -r dist/pharmacy-frontend/browser/. ../publish/wwwroot/
      - uses: azure/webapps-deploy@v3
        with:
          app-name: amaran-pharmacy
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
      - name: Check the live site
        run: |
          for i in $(seq 1 30); do
            if curl -fs https://amaran-pharmacy.azurewebsites.net/api/health; then echo; exit 0; fi
            sleep 10
          done
          exit 1
