server {
    listen 80;
    root /usr/share/nginx/html;

    # The API lives in the "api" container; same origin for the browser, so no CORS needed
    location ^~ /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed bundles never change, so cache them hard; index.html always revalidates
    location ~* \.(js|css|svg|png|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Angular routes (/sales/12, /reports...) are handled in the browser
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
