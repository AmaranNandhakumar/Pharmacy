# Runs the whole app: SQL Server, the API and the web front end.
#   cp .env.example .env   (then edit the passwords)
#   docker compose up --build
# Open http://localhost:8080
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in .env}
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build: ./backend
    environment:
      ConnectionStrings__DefaultConnection: "Server=db;Database=PharmacyDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env (32+ characters)}
      SeedAdmin__Email: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      SeedAdmin__Password: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      Database__MigrateOnStartup: "true"
      Demo__SeedOnStartup: ${SEED_DEMO:-false}
      Demo__Password: ${DEMO_PASSWORD:-Demo@Pass123}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  db-data:
